# Límite de intentos contra el login del panel.
#
# Se copia a /etc/nginx/snippets/voltac-login.conf y se incluye dentro del
# bloque `server` del sitio. Requiere que la zona esté declarada en el bloque
# http (ver /etc/nginx/conf.d/00-hardening.conf):
#
#   limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
#
# Diez peticiones por minuto por IP, con ráfaga de cinco. Una persona que
# escribe mal su contraseña no lo nota; un script que prueba miles de
# combinaciones se topa con un muro en el segundo intento.
#
# Es la primera de dos capas: la aplicación además bloquea la IP quince minutos
# tras cinco fallos. Nginx frena el volumen antes de que llegue a Node; la
# aplicación frena la persistencia.

location = /admin/login {
    limit_req zone=login burst=5 nodelay;
    limit_req_status 429;

    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
